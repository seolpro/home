<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>✈ 조합원 테마여행 보험 정보 입력</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f0f2f5;
      font-family: 'Noto Sans KR', sans-serif;
    }

    .form-section {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .form-label {
      font-weight: 600;
    }

    .section-divider {
      margin: 2rem 0 1rem;
      border-top: 2px solid #dee2e6;
      padding-top: 1rem;
      font-size: 1.2rem;
      font-weight: 500;
    }

    .highlight-note {
      background-color: #fff3cd;
      border-left: 5px solid #ffc107;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 0.5rem;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="form-section mx-auto" style="max-width: 640px;">
      <h3 class="text-center mb-4">🧾 여행자보험 정보 입력</h3>

      <div class="highlight-note">
        🤷🏽‍♀️ <strong>신청당시 작성하신 개인정보수집·활용 동의</strong>에 따라 보험 가입을 위한 정보를 제출받고자 합니다.
      </div>

      <form id="insuranceForm">
        <!-- 조합원 정보 -->
        <div class="mb-3">
          <label class="form-label">조합원 성명</label>
          <input type="text" class="form-control" id="memberName" placeholder="예: 홍길동" required>
        </div>

        <div class="mb-3">
          <label class="form-label">연락처 (숫자만)</label>
          <input type="text" class="form-control" id="memberContact" inputmode="numeric" placeholder="예: 01012345678" pattern="\d{11}" maxlength="11" required>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">생년월일 (6자리)</label>
            <input type="text" class="form-control" id="memberRRN1" inputmode="numeric" pattern="\d{6}" maxlength="6" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">주민번호 뒷자리 (7자리)</label>
            <input type="text" class="form-control" id="memberRRN2" inputmode="numeric" pattern="\d{7}" maxlength="7" required>
          </div>
        </div>

        <!-- 동반인 정보 -->
        <div class="section-divider">👥 동반인 정보 (선택)</div>

        <div class="mb-3">
          <label class="form-label">성명</label>
          <input type="text" class="form-control" id="partnerName" placeholder="예: 김동반">
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">생년월일 (6자리)</label>
            <input type="text" class="form-control" id="partnerRRN1" inputmode="numeric" pattern="\d{6}" maxlength="6">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">주민번호 뒷자리 (7자리)</label>
            <input type="text" class="form-control" id="partnerRRN2" inputmode="numeric" pattern="\d{7}" maxlength="7">
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-3" id="submitBtn">📨 제출하기</button>
      </form>

      <div class="mt-4 text-center" id="resultBox"></div>
    </div>
  </div>

  <script>
    document.getElementById('insuranceForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const data = {
        memberName: document.getElementById('memberName').value.trim(),
        memberContact: document.getElementById('memberContact').value.trim(),
        memberRRN1: document.getElementById('memberRRN1').value.trim(),
        memberRRN2: document.getElementById('memberRRN2').value.trim(),
        partnerName: document.getElementById('partnerName').value.trim(),
        partnerRRN1: document.getElementById('partnerRRN1').value.trim(),
        partnerRRN2: document.getElementById('partnerRRN2').value.trim()
      };

      // ✅ 입력 내용 확인
      const confirmMsg =
        `📋 입력 정보를 확인해 주세요:\n\n` +
        `조합원 성명: ${data.memberName}\n` +
        `연락처: ${data.memberContact}\n` +
        `주민번호: ${data.memberRRN1}-${data.memberRRN2}\n\n` +
        `동반인 성명: ${data.partnerName || '없음'}\n` +
        `동반인 주민번호: ${data.partnerRRN1 && data.partnerRRN2 ? data.partnerRRN1 + '-' + data.partnerRRN2 : '없음'}\n\n` +
        `이대로 제출하시겠습니까?`;

      if (!confirm(confirmMsg)) return;

      // ✅ 버튼 상태 업데이트
      submitBtn.innerText = "📤 제출중...";
      submitBtn.disabled = true;

      try {
        await fetch('여기에 실제 구글앱스크립트의 실행URL을 입력하세요.', {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        alert("✅ 구글시트와 앱스크립트가 설정될 경우 저장됩니다. 현재는 지정되지 않음. ");
        document.getElementById('insuranceForm').reset();
        document.getElementById('resultBox').innerHTML = '';
      } catch (error) {
        alert("🚫 제출 중 오류가 발생했습니다.");
      } finally {
        submitBtn.innerText = "📨 제출하기";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
