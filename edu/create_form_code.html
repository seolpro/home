<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>소스코드 복사 페이지</title>
<style>
textarea { width: 100%; height: 300px; margin-bottom: 10px; }
button { padding: 6px 12px; margin-bottom: 30px; }
</style>
<script>
function loadCode(url, targetId) {
  fetch(url)
    .then(res => {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(text => { document.getElementById(targetId).value = text; })
    .catch(err => { document.getElementById(targetId).value = '불러오기 실패: ' + err.message; });
}

function copyCode(targetId) {
  const ta = document.getElementById(targetId);
  ta.select();
  ta.setSelectionRange(0, 99999); // 모바일 대응
  document.execCommand('copy');
  alert('복사되었습니다.');
}
</script>
</head>
<body>

<h2>🛠️폼생성 HTML</h2>
<textarea id="formHtml" readonly></textarea>
<button onclick="copyCode('formHtml')">복사</button>

<h2>💡스키마 생성 HTML (GAS 내부)</h2>
<textarea id="schemaHtml" readonly></textarea>
<button onclick="copyCode('schemaHtml')">복사</button>

<h2>📌code.gs</h2>
<textarea id="codeGs" readonly></textarea>
<button onclick="copyCode('codeGs')">복사</button>

<script>
// GitHub Raw URL로 변경하여 로드
loadCode("https://raw.githubusercontent.com/seolpro/home/gh-pages/edu/txt/temp_form_html.txt", "formHtml");
loadCode("https://raw.githubusercontent.com/seolpro/home/gh-pages/edu/txt/SchemaBuild_html.txt", "schemaHtml");
loadCode("https://raw.githubusercontent.com/seolpro/home/gh-pages/edu/txt/form_code_gs.txt", "codeGs");
</script>

</body>
</html>
