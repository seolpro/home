<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>참석자 접수</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f6f8fb;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    }
    .iframe-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .iframe-wrap iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none; /* 처음엔 숨김 */
    }
    /* 로딩 오버레이 */
    .loading {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #f6f8fb;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      font-size: 1.1rem;
      color: #555;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #ccc;
      border-top-color: #0d6efd;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="iframe-wrap">
    <!-- 로딩 표시 -->
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <div>🔂로딩 중입니다...잠시만 기다려주세요</div>
    </div>

    <!-- 구글 Apps Script 웹앱 -->
    <iframe
      id="myIframe"
      src="https://script.google.com/a/macros/ajoucu.page/s/AKfycbzJ02FvlDMxifQsEUGyXoIOjMHTVUvRJdV_p4iAFbDCDqI2OnIJVwuqFnMWnTCnR56m/exec"
      title="참석자 접수"
      allowfullscreen
    ></iframe>
  </div>

  <script>
    const iframe = document.getElementById('myIframe');
    const loading = document.getElementById('loading');

    iframe.addEventListener('load', () => {
      loading.style.display = 'none';   // 로딩 숨김
      iframe.style.display = 'block';   // iframe 표시
    });
  </script>
</body>
</html>
