<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📝서약서_귀가
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .signature-wrapper {
      border: 1px solid #ced4da;
      border-radius: 4px;
      height: 150px;
      position: relative;
      background-color: #fff;
    }
    #signature-pad {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h5 class="mb-4">📝 서약서</h5>
    <form id="pledgeForm">
      <div class="mb-3">
        <p>
          본인은 다음의 서약 내용을 충분히 이해하고 이에 동의합니다. 🙂<br><br>
          - 본인은 <strong>귀가 시간에 관하여</strong> 아래와 같이 서약 합니다.  <br>
          - <strong>늦어도 익일 1시까지는 귀가 하기로 서약 합니다. </strong>만약 1시를 경과하여 귀가하는 경우 건당 5만원을 용돈에서 차감하고,<br>
            <strong>2시를 경과할 경우 건강 10만원 차감합니다, 또한, 만취로 귀가시에는 가중하여 추가 건강 10만원 차감하기로 </strong> 서약합니다. .
        </p>
      </div>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="agreeCheck" required>
        <label class="form-check-label" for="agreeCheck">
          본인은 위와 같이 서약하며 아래에 서명 합니다.  🙋 <br><br>
          2025년 5월 13일 <br><br>
        </label>
      </div>

      <div class="mb-3">
        <label for="name" class="form-label">이름</label>
        <input type="text" class="form-control" id="name" name="name" required />
      </div>

      <div class="mb-3">
        <label class="form-label">서명 ✍️</label>
        <div class="signature-wrapper mb-2">
          <canvas id="signature-pad"></canvas>
        </div>
        <button type="button" class="btn btn-sm btn-secondary" id="clear">서명 지우기</button>
      </div>

      <button type="submit" class="btn btn-primary mt-3">제출하기 ✅</button>
    </form>

    <div id="result" class="mt-3 text-success fw-bold"></div>
    <div class="mt-4 text-center">
        <a href="https://docs.google.com/spreadsheets/d/1OQZP0_p_B_Olqg5b8iGxzN4B8g72YH7A_JxMpD4hYbw/edit?usp=sharing" 
           target="_blank" 
           class="btn btn-outline-primary">
          📄 서약서 보기
        </a>
      </div>
      
  </div>

  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.5/dist/signature_pad.umd.min.js"></script>
  <script>
    const form = document.getElementById('pledgeForm');
    const canvas = document.getElementById('signature-pad');
    const clearBtn = document.getElementById('clear');
    const resultBox = document.getElementById('result');

    function resizeCanvas() {
      const wrapper = document.querySelector('.signature-wrapper');
      canvas.width = wrapper.offsetWidth;
      canvas.height = wrapper.offsetHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const signaturePad = new SignaturePad(canvas);

    clearBtn.addEventListener('click', () => signaturePad.clear());

    form.addEventListener('submit', async (e) => {
  e.preventDefault();

  if (signaturePad.isEmpty()) {
    alert("서명을 해주세요.");
    if ("vibrate" in navigator) navigator.vibrate(200); // 진동 추가
    return;
  }

  const name = document.getElementById('name').value.trim();
  const signature = signaturePad.toDataURL();
  const payload = { name, signature };

  const submitBtn = document.querySelector('button[type="submit"]');
  const originalBtnText = submitBtn.textContent;
  submitBtn.textContent = "🔄제출중...";
  submitBtn.disabled = true;

  try {
    await fetch('https://script.google.com/macros/s/AKfycbx3cwOs_uP4LlvpT6kBKsHmTi1Y_rh9vKaSOxgulOeDoMdrW2EEMQAJUhcIgdohFfVK/exec', {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify(payload),
      headers: {
        'Content-Type': 'application/json'
      }
    });

    if ("vibrate" in navigator) navigator.vibrate([100, 50, 100]); // 성공시 짧은 진동 2회 
    alert('🚀서약서가 정상 제출 되었습니다');
    resultBox.textContent = "✅ 서약서가 정상적으로 제출되었습니다.";
    resultBox.classList.add('text-success');

    form.reset();
    signaturePad.clear();
  } catch (error) {
    if ("vibrate" in navigator) navigator.vibrate([200, 100, 200]); // 실패시 강한 진동 2회
    resultBox.textContent = "❌ 제출 중 문제가 발생했습니다. 다시 시도해주세요.";
    resultBox.classList.add('text-danger');
  } finally {
    submitBtn.textContent = originalBtnText;
    submitBtn.disabled = false;
  }
});
     
  </script>
</body>
</html>
