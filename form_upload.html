<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>파일 업로드 & 배포하기</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<style>
  body { background:#f8f9fa; }
  .dropzone { border:2px dashed #ced4da; border-radius:12px; background:#fff; padding:40px; text-align:center; transition:background .15s; }
  .dropzone.dragover { background:#f1f8ff; }
</style>
</head>
<body class="container py-5">
  <h3 class="mb-4">📤TO Host 파일 업로드(배포)</h3>

  <div id="drop" class="dropzone mb-3">
    <p class="mb-2">🧩만들어진 [form_****.html]파일을 여기로 파일을 끌어다 놓으세요</p>
    <p class="text-muted">또는</p>
    <button id="btnPick" class="btn btn-primary">📤파일 선택</button>
    <input id="fileInput" type="file" multiple hidden />
  </div>
  
 <div style="display: none;">
  <div class="mb-3">
    <label class="form-label">서버 업로드 URL</label>
    <input type="text" class="form-control" id="endpoint" value="https://ajoucu.mycafe24.com/upload.php"/>
  </div>

  <div class="mb-3">
    <label class="form-label">업로드 토큰</label>
    <input type="text" class="form-control" id="token" value="f1a7e6c2d47b9a85e3190b1f54c7d63f98e0a24d7b5c63f2d85c7a19e3f04a61"/>
    <div class="form-text">※ 토큰은 서버(upload.php)와 동일해야 합니다.</div>
  </div>
</div>

  <div class="progress mb-3" role="progressbar" aria-label="Upload progress" style="height: 20px;">
    <div id="bar" class="progress-bar" style="width: 0%;">0%</div>
  </div>
  <strong>🚀업로더 후 배포 URL이 아래에 생성됩니다. Click시 바로 연결됨...</strong>
  <div id="log" class="small"></div>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const btnPick = document.getElementById('btnPick');
const bar = document.getElementById('bar');
const log = document.getElementById('log');

btnPick.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => uploadFiles(fileInput.files));

['dragenter','dragover'].forEach(evt => {
  drop.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); drop.classList.add('dragover'); });
});
['dragleave','drop'].forEach(evt => {
  drop.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); drop.classList.remove('dragover'); });
});
drop.addEventListener('drop', e => {
  e.preventDefault(); e.stopPropagation(); // ← 기본 열림 방지
  const files = e.dataTransfer.files;
  if (files && files.length) uploadFiles(files);
});

function appendLog(html) { log.insertAdjacentHTML('beforeend', `<div>${html}</div>`); }
function updateProgress(pct) { bar.style.width = pct + '%'; bar.textContent = pct + '%'; }
function esc(s){return String(s).replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

async function uploadFiles(files) {
  const endpoint = document.getElementById('endpoint').value.trim();
  const token    = document.getElementById('token').value.trim();
  if (!endpoint || !token) { alert('업로드 URL과 토큰을 확인하세요.'); return; }
  if (!files || !files.length) return;

  updateProgress(0);

  const fd = new FormData();
  Array.from(files).forEach(f => fd.append('files[]', f));
  fd.append('token', token); // 폼필드로 전송(프리플라이트 회피)

  try {
    const res = await fetch(endpoint, { method:'POST', body: fd }); // 커스텀 헤더 없음
    const text = await res.text();
    let data = null; try { data = JSON.parse(text); } catch(e) {}
    if (!res.ok || !data) {
      appendLog(`<span class="text-danger">업로드 실패: HTTP ${res.status} / ${esc(text.slice(0,200))}</span>`);
      return;
    }

    if (data.ok) {
      const baseOrigin = new URL(endpoint).origin; // 예: https://ajoucu.mycafe24.com
      data.results.forEach(r => {
        if (r.ok) {
          // 서버가 절대 URL(r.url)을 주면 그걸 사용, 아니면 endpoint 오리진 + r.path로 보정
          const fileUrl = r.url
            || (r.path?.startsWith('http') ? r.path : (baseOrigin + r.path));
          appendLog(`✅ ${esc(r.name)} → <a href="${fileUrl}" target="_blank">${fileUrl}</a> (${(r.size/1024).toFixed(1)} KB)`);
        } else {
          appendLog(`❌ ${esc(r.name)} → ${esc(r.error||'unknown')}`);
        }
      });
      updateProgress(100);
    } else {
      appendLog(`<span class="text-danger">오류: ${esc(data.error||'unknown')}</span>`);
    }
  } catch (err) {
    appendLog(`<span class="text-danger">네트워크 오류: ${esc(err.message)}</span>`);
  } finally {
    fileInput.value = ''; // 같은 파일 재선택 허용
  }
}
</script>
</body>
</html>
