<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS (head 안에 삽입) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Document</title>
<style>
    .carousel-inner img {
      height: 300px;
      object-fit: cover;
    }
  </style>  
</head>
<body>
<!-- 이미지 슬라이드 -->
<div id="mainCarousel" class="carousel slide mb-4" data-bs-ride="carousel">
    <!-- 슬라이드 인디케이터 (동그라미) -->
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="0" class="active" aria-current="true"></button>
      <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="1"></button>
      <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="2"></button>
      <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="3"></button>
    </div>
  
    <!-- 슬라이드 이미지 영역 -->
    <div class="carousel-inner rounded shadow">
      <div class="carousel-item active">
        <img src="https://img.freepik.com/free-vector/copy-space-spring-floral-background-blue-sky_52683-55621.jpg" class="d-block w-100" alt="슬라이드1">
      </div>
      <div class="carousel-item">
        <img src="https://i.namu.wiki/i/y1YdsLpT6C5sfbOzPiNIsjl90hDpnEKFbxl7gGT2DmPtTfGqrsOQMfVOoI23Is2_gbi87xDQfI4tkp2yUCSVqA.webp" class="d-block w-100" alt="슬라이드2">
      </div>
      <div class="carousel-item">
        <img src="https://img.lovepik.com/background/20211021/large/lovepik-spring-floral-background-image_401686078.jpg" class="d-block w-100" alt="슬라이드3">
      </div>
      <div class="carousel-item">
        <img src="https://onsabo.daesang.co.kr:8443/file/75fb40869409437186f8bde01d0ad1e0.jpg" class="d-block w-100" alt="슬라이드4">
      </div>
    </div>
  
    <!-- 좌우 이동 버튼 -->
    <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">이전</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">다음</span>
    </button>
  </div>
  <!-- Bootstrap JS Bundle (body 맨 아래에 삽입) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const carouselElement = document.querySelector('#mainCarousel');
    const carousel = new bootstrap.Carousel(carouselElement, {
      interval: 3000, // 3초마다 슬라이드
      ride: 'carousel'
    });
  </script>
  
</body>
</html>
