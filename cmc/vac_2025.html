<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>응급병동 2025 잔여 휴가사용계획</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f8f9fa;
      font-family: 'Arial', sans-serif;
    }

    .iframe-container {
      max-width: 100%;
      margin: 30px auto;
      text-align: center;
    }

    .iframe-container iframe {
      width: 95%;
      height: 600px;
      border: none;
      display: block;
      margin: 0 auto;
    }

    .iframe-container img {
      display: block;
      margin: 20px auto 0;
      width: 200px;
    }
     .spinner-container {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .spinner {
      border: 6px solid #e0e0e0;
      border-top: 6px solid #007bff;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .spinner-text {
      margin-top: 10px;
      font-size: 1rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <!-- 로딩 스피너 -->
    <div class="spinner-container" id="spinner">
      <div class="spinner"></div>
      <div class="spinner-text">🚑페이지 불러오는 중...</div>
    </div>
    <iframe
      src="https://script.google.com/macros/s/AKfycby4yjbCYeNyaA3bIsSCBTfcuMusvfkQ95Z0KnH_siVppei1FxelUV4spYqVLj47WDtf/exec"
      title="응급병동 2025휴가 입력"
      onload="iframeLoaded()">
    </iframe>
    <img src="img/cmclogo.png" alt="CMC Logo">
  </div>

    <script>
    function iframeLoaded() {
      const iframe = document.querySelector('iframe');
      const spinner = document.getElementById('spinner');
      spinner.style.display = 'none';
      iframe.style.display = 'block';
    }
  </script>
</body>
</html>
