<script>
async function copyImage(url){
  const res = await fetch(url);
  const blob = await res.blob();

  if (!navigator.clipboard || !window.ClipboardItem) {
    alert("이 브라우저는 이미지 복사를 지원하지 않아요. 다운로드를 사용해주세요.");
    return;
  }

  await navigator.clipboard.write([
    new ClipboardItem({ [blob.type]: blob })
  ]);

  alert("✅ 이미지가 복사됐어요! 카톡/문서에 붙여넣기 해보세요.");
}

document.getElementById("copyBtn").addEventListener("click", () => {
  const url = document.getElementById("guideImg").src;
  copyImage(url);
});
</script>

    async function copyText(text){
      try{
        await navigator.clipboard.writeText(text);
        return true;
      }catch(e){
        try{
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          const ok = document.execCommand("copy");
          document.body.removeChild(ta);
          return ok;
        }catch(_){
          return false;
        }
      }
    }

    function toast(msg){
      document.getElementById("toastMsg").textContent = msg;
      const t = bootstrap.Toast.getOrCreateInstance(document.getElementById("toast"), { delay: 1500 });
      t.show();
    }

    function renderChips(){
      const el = document.getElementById("chips");
      el.innerHTML = "";
      themes().forEach(th => {
        const b = document.createElement("div");
        b.className = "chip" + (state.theme === th ? " active":"");
        b.textContent = th;
        b.onclick = () => { state.theme = th; renderList(); renderChips(); };
        el.appendChild(b);
      });
    }

    function matchTemplate(t){
      const q = state.q.trim().toLowerCase();
      const themeOk = (state.theme === "전체") || (t.theme === state.theme);
      if(!themeOk) return false;
      if(!q) return true;
      return (t.title.toLowerCase().includes(q) || t.body.toLowerCase().includes(q));
    }

    function renderList(){
      const el = document.getElementById("list");
      const filtered = TEMPLATES.filter(matchTemplate);

      if(filtered.length === 0){
        el.innerHTML = `
          <div class="cardx p-4 text-center">
            <div class="fw-bold">검색 결과가 없어요 🥲</div>
            <div class="muted mt-2">다른 키워드로 다시 검색해보세요.</div>
          </div>
        `;
        return;
      }

      el.innerHTML = filtered.map((t, idx) => `
        <div class="cardx p-3 p-md-4">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-2">
            <div>
              <div class="muted small mb-1"><i class="bi bi-tag"></i> ${t.theme}</div>
              <div class="fw-bold">${t.title}</div>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-soft rounded-pill" data-copy="${idx}">
                <i class="bi bi-clipboard"></i> 복사하기
              </button>
              <button class="btn btn-soft rounded-pill" data-select="${idx}">
                <i class="bi bi-cursor-text"></i> 선택
              </button>
            </div>
          </div>
          <textarea class="template w-100" data-ta="${idx}" readonly>${t.body}</textarea>
        </div>
      `).join("");

      el.querySelectorAll("[data-copy]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const i = parseInt(btn.getAttribute("data-copy"), 10);
          const ta = el.querySelector(`[data-ta="${i}"]`);
          const ok = await copyText(ta.value);
          toast(ok ? "복사되었습니다 ✅" : "복사 실패 🥲 (선택 후 Ctrl+C로 복사해주세요)");
        });
      });

      el.querySelectorAll("[data-select]").forEach(btn => {
        btn.addEventListener("click", () => {
          const i = parseInt(btn.getAttribute("data-select"), 10);
          const ta = el.querySelector(`[data-ta="${i}"]`);
          ta.focus();
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          toast("선택되었습니다. Ctrl+C로 복사 가능해요 😊");
        });
      });
    }

    // 검색
    const q = document.getElementById("q");
    q.addEventListener("input", () => { state.q = q.value || ""; renderList(); });
    document.getElementById("btnClear").addEventListener("click", () => {
      q.value = ""; state.q = ""; renderList(); q.focus();
    });

    // 시작
    renderChips();
    renderList();
  </script>
</body>
</html>
