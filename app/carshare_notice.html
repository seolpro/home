<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>차량공유 상담톡 문구 모음</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    :root{
      --bg:#0b1220;
      --card:rgba(255,255,255,.06);
      --bd:rgba(255,255,255,.12);
      --txt:#eaf2ff;
      --muted:rgba(234,242,255,.7);
      --radius:18px;
      --shadow:0 10px 28px rgba(0,0,0,.28);
    }
    body{
      color:var(--txt);
      background:
        radial-gradient(1100px 520px at 12% 0%, rgba(37,99,235,.35), transparent 60%),
        radial-gradient(900px 520px at 90% 8%, rgba(168,85,247,.28), transparent 55%),
        var(--bg);
      min-height:100vh;
    }
    .hero{
      border-bottom:1px solid var(--bd);
      background: rgba(255,255,255,.03);
      backdrop-filter: blur(10px);
    }
    .cardx{
      background: var(--card);
      border:1px solid var(--bd);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
    }
    .chip{
      border:1px solid var(--bd);
      background: rgba(255,255,255,.04);
      color: var(--txt);
      border-radius: 999px;
      padding: .35rem .7rem;
      font-size: .9rem;
      cursor:pointer;
      user-select:none;
    }
    .chip.active{
      background: rgba(37,99,235,.25);
      border-color: rgba(37,99,235,.45);
    }
    textarea.template{
      background: rgba(0,0,0,.25);
      color: var(--txt);
      border:1px solid var(--bd);
      border-radius: 14px;
      padding: 12px 12px;
      min-height: 110px;
      resize: vertical;
    }
    .btn-soft{
      border:1px solid var(--bd);
      background: rgba(255,255,255,.06);
      color: var(--txt);
    }
    .btn-soft:hover{ background: rgba(255,255,255,.10); }
    .muted{ color: var(--muted); }
    .sticky-tools{ position: sticky; top: 0; z-index: 30; }
  </style>
</head>

<body>
  <div class="hero py-4">
    <div class="container">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
        <div>
          <div class="d-flex align-items-center gap-2">
            <i class="bi bi-chat-dots-fill fs-4"></i>
            <h1 class="h4 m-0 fw-bold">차량공유 상담톡 문구 모음</h1>
          </div>
          <div class="muted mt-1">테마 선택 → “복사하기” → 상담톡에 붙여넣기</div>
        </div>
      </div>
    </div>
  </div>

  <div class="container py-4">

    <!-- 검색/테마 -->
    <div class="cardx p-3 p-md-4 mb-4 sticky-tools">
      <div class="row g-3 align-items-end">
        <div class="col-12 col-lg-5">
          <label class="form-label fw-bold mb-1">검색</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent text-white border-secondary-subtle"><i class="bi bi-search"></i></span>
            <input id="q" class="form-control bg-transparent text-white border-secondary-subtle"
                   placeholder="예: 반납, 연장, 사고, 주유, 청소..." />
            <button class="btn btn-soft" id="btnClear"><i class="bi bi-x-lg"></i></button>
          </div>
          <div class="muted small mt-1">제목/내용 검색</div>
        </div>

        <div class="col-12 col-lg-7">
          <label class="form-label fw-bold mb-1">테마</label>
          <div id="chips" class="d-flex flex-wrap gap-2"></div>
        </div>
      </div>
    </div>

    <div id="list" class="d-grid gap-3"></div>

    <div class="muted text-center small mt-4 mb-2">
      ※ 복사가 안 되면 “선택” 버튼으로 전체 선택 후 Ctrl+C로 복사하세요.
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999">
    <div id="toast" class="toast text-bg-dark border-secondary-subtle" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="toastMsg">복사되었습니다.</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // =========================
    // ✅ 문구 데이터 (여기만 바꾸면 됨)
    // =========================
    const TEMPLATES = [
      { theme:"예약/확인", title:"예약 확인 안내", body:
`안녕하세요 😊 공유차량 이용 안내입니다.

- 픽업/반납 장소 확인
🚩 화성시 동탄숲속로103, 능동역센트럴경남아너스빌 808동 (주차장 지하1층~3층)
(차주 부재시) 도착시 연락주시면 차량문 오픈 해 드립니다. 
✅대여기간 아파트내 차량주차 가능합니다(정문 경비실에 808동 공유차 픽업 왔다고 하고 들어오세요)
아파트에 외부차량 주차등록 시스템은 없습니다.` },

      { theme:"이용 전", title:"픽업 전 안내", body:
`픽업 전 안내드립니다 😊
1) 운전면허증 지참(필수)
2) 출발 전 차량 외관/계기판 사진 촬영 및 타운카 픽업처리 바랍니다.
3) 이상 발견 시 출발 전에 바로 연락 부탁드립니다.
4) 테슬라 첫이용이시면 아래 사용설명서 유튜버 영상 참고 바랍니다. 
🎞https://www.youtube.com/watch?v=5AK9S3niLTk
5) 카드키 및 환경부인증 범용 충전카드는 차량내부에 있습니다.` },

      { theme:"반납", title:"반납 안내", body:
`반납 안내드립니다 😊
- 개인 물품/트렁크 확인
- 쓰레기 정리 및 기본 정돈
- 외관/계기판(잔여밧데리/주행거리) 사진 촬영 권장
반납 완료 후 “반납 완료” 메시지 부탁드립니다.` },

      { theme:"연장/변경", title:"반납 지연(연장 필요) 안내", body:
`반납 시간이 넘어갈 경우 다음 예약에 영향을 줄 수 있어요 🙏
연장 필요하시면 사전에 “원하는 연장 시간”을 알려주세요.
가능 여부 확인 후 안내 드리겠습니다.` },

      { theme:"충전/요금", title:"충전 안내", body:
`충전 안내드립니다 😊
충전은 테슬라 슈퍼차저 또는 일반 충전소를 이용하시면 됩니다. 
(차량 내부에 환경부 인증카드 비치)
테슬라 슈퍼차저는 별도 카드 없이 바로 이용가능` },

      { theme:"청소/이용수칙", title:"청결/흡연 금지 안내", body:
`쾌적한 부탁 내드립니다 🙏
- 차량 내 흡연(전자담배 포함) 불가
- 음식물/쓰레기 기본 정리 부탁 드립니다
- 심한 오염 또는 냄새가 있을 경우 추가 세차비가 발생할 수 있습니다.` },

      { theme:"사고/고장", title:"사고 발생 시 안내", body:
`사고 발생 시 안내드립니다 (안전 최우선) 🙏
1) 우선 타운카로 연락 바랍니다.
2) 차주에게도 즉시 채팅/연락 부탁 드립니다
   사고처리는 타운카에서 지원해 드립니다.` },

      { theme:"분실/기타", title:"분실물 문의 안내", body:
`분실물 확인 도와드릴게요 😊
- 분실물 종류 / 추정 위치(좌석/트렁크 등)
- 마지막 이용 시간
남겨주시면 확인되는 대로 안내드리겠습니다.` },
    ];

    // =========================
    // 상태/유틸
    // =========================
    const state = { theme:"전체", q:"" };

    function themes(){
      const set = new Set(TEMPLATES.map(t => t.theme));
      return ["전체", ...Array.from(set)];
    }

    async function copyText(text){
      try{
        await navigator.clipboard.writeText(text);
        return true;
      }catch(e){
        try{
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          const ok = document.execCommand("copy");
          document.body.removeChild(ta);
          return ok;
        }catch(_){
          return false;
        }
      }
    }

    function toast(msg){
      document.getElementById("toastMsg").textContent = msg;
      const t = bootstrap.Toast.getOrCreateInstance(document.getElementById("toast"), { delay: 1500 });
      t.show();
    }

    function renderChips(){
      const el = document.getElementById("chips");
      el.innerHTML = "";
      themes().forEach(th => {
        const b = document.createElement("div");
        b.className = "chip" + (state.theme === th ? " active":"");
        b.textContent = th;
        b.onclick = () => { state.theme = th; renderList(); renderChips(); };
        el.appendChild(b);
      });
    }

    function matchTemplate(t){
      const q = state.q.trim().toLowerCase();
      const themeOk = (state.theme === "전체") || (t.theme === state.theme);
      if(!themeOk) return false;
      if(!q) return true;
      return (t.title.toLowerCase().includes(q) || t.body.toLowerCase().includes(q));
    }

    function renderList(){
      const el = document.getElementById("list");
      const filtered = TEMPLATES.filter(matchTemplate);

      if(filtered.length === 0){
        el.innerHTML = `
          <div class="cardx p-4 text-center">
            <div class="fw-bold">검색 결과가 없어요 🥲</div>
            <div class="muted mt-2">다른 키워드로 다시 검색해보세요.</div>
          </div>
        `;
        return;
      }

      el.innerHTML = filtered.map((t, idx) => `
        <div class="cardx p-3 p-md-4">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-2">
            <div>
              <div class="muted small mb-1"><i class="bi bi-tag"></i> ${t.theme}</div>
              <div class="fw-bold">${t.title}</div>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-soft rounded-pill" data-copy="${idx}">
                <i class="bi bi-clipboard"></i> 복사하기
              </button>
              <button class="btn btn-soft rounded-pill" data-select="${idx}">
                <i class="bi bi-cursor-text"></i> 선택
              </button>
            </div>
          </div>
          <textarea class="template w-100" data-ta="${idx}" readonly>${t.body}</textarea>
        </div>
      `).join("");

      el.querySelectorAll("[data-copy]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const i = parseInt(btn.getAttribute("data-copy"), 10);
          const ta = el.querySelector(`[data-ta="${i}"]`);
          const ok = await copyText(ta.value);
          toast(ok ? "복사되었습니다 ✅" : "복사 실패 🥲 (선택 후 Ctrl+C로 복사해주세요)");
        });
      });

      el.querySelectorAll("[data-select]").forEach(btn => {
        btn.addEventListener("click", () => {
          const i = parseInt(btn.getAttribute("data-select"), 10);
          const ta = el.querySelector(`[data-ta="${i}"]`);
          ta.focus();
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          toast("선택되었습니다. Ctrl+C로 복사 가능해요 😊");
        });
      });
    }

    // 검색
    const q = document.getElementById("q");
    q.addEventListener("input", () => { state.q = q.value || ""; renderList(); });
    document.getElementById("btnClear").addEventListener("click", () => {
      q.value = ""; state.q = ""; renderList(); q.focus();
    });

    // 시작
    renderChips();
    renderList();
  </script>
</body>
</html>
