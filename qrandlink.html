<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR코드 생성 & URL단축하기</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color:#f8f9fa; }
    .card { border-radius:1.5rem; box-shadow:0 4px 6px rgba(0,0,0,0.1); }
    .btn-primary { border-radius:50px; padding:.75rem 1.5rem; }
    .btn-secondary { border-radius:50px; padding:.5rem 1rem; margin-top:10px; }
    .short-url { font-size:1.2rem; font-weight:bold; }
    .uniform-width { max-width:600px; margin:0 auto; }
    .usage-metrics small { color:#6c757d; }
    .metric { display:flex; justify-content:space-between; align-items:center; }
    .metric b { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="bg-light">
  <div class="container py-5">
    <h3 class="text-center mb-4">🔗 QR 코드 생성기</h3>

    <div class="card shadow p-4 uniform-width">
      <div class="mb-3">
        <label for="qrText" class="form-label">✍QR 코드에 담을 내용을 입력하세요</label>
        <input type="text" id="qrText" class="form-control" placeholder="예: https://www.naver.com">
      </div>

      <div class="d-grid gap-2">
        <button id="generateBtn" class="btn btn-primary" onclick="generateQR()">QR 코드 생성</button>
      </div>

      <div class="text-center mt-4" id="qrResult"></div>
    </div>
  </div>

  <hr>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow p-4 uniform-width">
          <h3 class="text-center mb-4">🔗 URL 단축하기(by bitly)</h3>
          <div class="mb-3">
            <input type="text" class="form-control" id="longUrl" placeholder="단축할 URL 을 붙여 넣으세요">
          </div>
          <div class="mb-3">
            <input type="text" class="form-control" id="urlTitle" placeholder="URL 제목을 입력하세요" required>
          </div>
          <div class="d-grid">
            <button class="btn btn-primary" onclick="shortenUrl()">✔️ URL 단축생성</button>
          </div>

          <p class="text-center mt-3">📌현재 누적 생성된 URL 수: <span id="urlCount">0</span> 개</p>

          <!-- ✅ 이번 달 소진 현황 카드 -->
          <div class="mt-4">
            <div class="card p-3">
              <div class="usage-metrics">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <h5 class="m-0">🧩무료 토큰 당월 소진 현황</h5>
                  <small id="usagePeriod" class="text-muted"></small>
                </div>

                <!-- Links -->
                <div class="metric mb-1">
                  <span>링크</span>
                  <span>
                    <b id="linksLeft">-</b> / <span id="linksLimit">-</span>
                    <small class="ms-1 text-muted">(사용 <b id="linksUsed">-</b>)</small>
                  </span>
                </div>
                <div class="progress mb-3" role="progressbar" aria-label="Links usage">
                  <div id="linksBar" class="progress-bar" style="width:0%"></div>
                </div>

                <!-- Custom back-half (감지되면 표시, 아니면 숨김) -->
                <div id="customWrap" class="d-none">
                  <div class="metric mb-1">
                    <span>커스텀</span>
                    <span>
                      <b id="customLeft">-</b> / <span id="customLimit">-</span>
                      <small class="ms-1 text-muted">(사용 <b id="customUsed">-</b>)</small>
                    </span>
                  </div>
                  <div class="progress" role="progressbar" aria-label="Custom usage">
                    <div id="customBar" class="progress-bar" style="width:0%"></div>
                  </div>
                </div>

                <small class="d-block mt-2 text-muted" id="usageHint">
                  * 무료 커스텀 현황은 USAGE_API가 제공될 때 표시됩니다.
                </small>
              </div>
            </div>
          </div>

          <div class="mt-4 text-center">
            <p class="short-url text-success" id="shortenedUrl"></p>
            <button class="btn btn-secondary d-none" id="copyBtn" onclick="copyToClipboard()">📋 Copy Short URL</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* =====================[ 설정 ]===================== */
    // 플랜 한도 (필요 시 변경)
    const PLAN = { LINKS_LIMIT: 10, CUSTOM_LIMIT: 5 };

    // 기존 카운트 API (이미 사용 중인 GAS)
    const COUNT_API = 'https://script.google.com/macros/s/AKfycbwYP_LvtTqtqI11andvdFr4AWepFWsMqbroNRyvVawK4FNVPfsUEUKlc2Bsw3jVoS5m/exec';

    // (옵션) USAGE_API: {"linksUsed":number,"customUsed":number} 반환 시 커스텀 현황까지 표기
    // 예: const USAGE_API = COUNT_API + '?mode=usage';
    const USAGE_API = ''; // 제공되면 URL 넣기. 없으면 커스텀 섹션 숨김 유지.

    /* ================ QR 코드 ================ */
    function generateQR() {
      const text = document.getElementById('qrText').value.trim();
      const qrDiv = document.getElementById('qrResult');

      if (!text) {
        qrDiv.innerHTML = `<div class="alert alert-warning">⛔상단 입력란에 QR코드에 담을 내용을 입력해주세요.</div>`;
        return;
      }

      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(text)}`;
      qrDiv.innerHTML = `
        <h5 class="mt-3 fw-bold">✨생성된 QR Code</h5>
        <img id="qrImage" src="${qrUrl}" alt="QR Code" class="img-thumbnail mb-2">
        <p class="text-muted small">| ${text} |</p>
        <button class="btn btn-outline-secondary btn-sm" onclick="copyQR()">📋 QR 코드 복사하기</button>
      `;
    }

    function copyQR() {
      const img = document.getElementById('qrImage');
      fetch(img.src)
        .then(res => res.blob())
        .then(blob => {
          const item = new ClipboardItem({ 'image/png': blob });
          navigator.clipboard.write([item]);
          alert('✅ QR 코드 이미지가 복사되었습니다!');
        })
        .catch(err => {
          console.error('복사 실패:', err);
          alert('❌ 복사에 실패했습니다. 브라우저를 확인하세요.');
        });
    }

    document.getElementById('qrText').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') generateQR();
    });

    /* ================ URL 단축 ================ */
    document.getElementById('longUrl').addEventListener('keydown', function(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        shortenUrl();
      }
    });

    // 페이지 로드시 카운트 & 소진현황
    window.onload = async () => {
      await updateUrlCount();
      await refreshUsage(); // ✅ 소진현황 갱신
    };

    // 카운트 조회
    async function updateUrlCount() {
      const urlCountEl = document.getElementById('urlCount');
      try {
        const res = await fetch(COUNT_API);
        const data = await res.json();
        urlCountEl.textContent = data.count;
      } catch (err) {
        console.error('카운트 불러오기 실패', err);
        urlCountEl.textContent = 'Error';
      }
    }

    // 소진현황 갱신(USAGE_API 있으면 커스텀까지, 없으면 링크만)
    async function refreshUsage() {
      // 기간 표시(이번 달)
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth(), 1);
      const end = new Date(now.getFullYear(), now.getMonth() + 1, 0);
      document.getElementById('usagePeriod').textContent =
        `${start.getFullYear()}.${String(start.getMonth()+1).padStart(2,'0')}.01 ~ ${end.getFullYear()}.${String(end.getMonth()+1).padStart(2,'0')}.${String(end.getDate()).padStart(2,'0')}`;

      // 링크 사용량 (필수)
      let linksUsed = 0;
      try {
        const res = await fetch(COUNT_API);
        const data = await res.json();
        linksUsed = Number(data.count) || 0;
      } catch (e) {
        console.warn('COUNT_API 실패, 링크 사용량 0으로 처리');
      }
      const linksLeft = Math.max(0, PLAN.LINKS_LIMIT - linksUsed);
      const linksPct = Math.min(100, (linksUsed / Math.max(1, PLAN.LINKS_LIMIT)) * 100);

      document.getElementById('linksUsed').textContent = linksUsed;
      document.getElementById('linksLimit').textContent = PLAN.LINKS_LIMIT;
      document.getElementById('linksLeft').textContent = linksLeft;
      document.getElementById('linksBar').style.width = `${linksPct}%`;
      document.getElementById('linksBar').ariaValueNow = Math.round(linksPct);

      // 커스텀(선택)
      const customWrap = document.getElementById('customWrap');
      const hint = document.getElementById('usageHint');

      if (USAGE_API) {
        try {
          const r = await fetch(USAGE_API);
          if (!r.ok) throw new Error('USAGE_API not ok');
          const u = await r.json(); // {linksUsed, customUsed}
          const customUsed = Number(u.customUsed) || 0;
          const customLeft = Math.max(0, PLAN.CUSTOM_LIMIT - customUsed);
          const customPct = Math.min(100, (customUsed / Math.max(1, PLAN.CUSTOM_LIMIT)) * 100);

          document.getElementById('customUsed').textContent = customUsed;
          document.getElementById('customLimit').textContent = PLAN.CUSTOM_LIMIT;
          document.getElementById('customLeft').textContent = customLeft;
          document.getElementById('customBar').style.width = `${customPct}%`;
          document.getElementById('customBar').ariaValueNow = Math.round(customPct);

          customWrap.classList.remove('d-none');
          hint.textContent = ' ';
        } catch (e) {
          // 사용 불가 시 커스텀 섹션 숨김
          customWrap.classList.add('d-none');
          hint.textContent = '* 커스텀 현황은 USAGE_API가 제공될 때 표시됩니다.';
        }
      } else {
        customWrap.classList.add('d-none');
        hint.textContent = '* 커스텀 현황은 USAGE_API가 제공될 때 표시됩니다.';
      }
    }

    // URL 단축 및 시트 기록
    async function shortenUrl() {
      const longUrl = document.getElementById('longUrl').value.trim();
      const title = document.getElementById('urlTitle').value.trim();
      const resultEl = document.getElementById('shortenedUrl');
      const copyBtn = document.getElementById('copyBtn');

      if (!longUrl) {
        resultEl.innerHTML = '<span class="text-danger">Please enter a valid URL.</span>';
        copyBtn.classList.add('d-none');
        return;
      }
      if (!title) {
        alert('⚠️ URL 제목을 입력하세요.');
        return;
      }

      try {
        const response = await fetch('https://api-ssl.bitly.com/v4/shorten', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer af512e91365114a59213737ef6b8b7517176c3c6',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ long_url: longUrl })
        });
        if (!response.ok) throw new Error('Failed to shorten the URL');

        const data = await response.json();
        resultEl.innerHTML = `<a href="${data.link}" target="_blank">${data.link}</a>`;
        resultEl.setAttribute('data-url', data.link);
        copyBtn.classList.remove('d-none');

        // 기록
        const logResponse = await fetch(COUNT_API, {
          method: 'POST',
          contentType: 'application/json',
          body: JSON.stringify({
            shortUrl: data.link,
            originalUrl: longUrl,
            title: title
          })
        });
        const logData = await logResponse.json();
        if (logData.status === 'duplicate') {
          alert(`⚠️ 이미 등록된 URL입니다. count시트 ${logData.row}행에 등록되어 있어요.`);
        }

        // ✅ 카운트 & 소진현황 즉시 갱신
        await updateUrlCount();
        await refreshUsage();

      } catch (error) {
        console.error(error);
        resultEl.innerHTML = '<span class="text-danger">Error shortening the URL. Please try again.</span>';
        copyBtn.classList.add('d-none');
      }
    }

    // 복사 버튼
    function copyToClipboard() {
      const url = document.getElementById('shortenedUrl').getAttribute('data-url');
      if (url) {
        navigator.clipboard.writeText(url).then(() => {
          alert('✅ 단축된 URL이 클립보드에 복사되었습니다.');
        }).catch(() => {
          alert('❌ 복사에 실패했습니다. 다시 시도해주세요.');
        });
      } else {
        alert('❌ 복사할 URL이 없습니다.');
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
