<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>아르바이트 종료 서약서</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .signature-wrapper {
      border: 1px solid #ced4da;
      border-radius: 4px;
      height: 150px;
      position: relative;
      background-color: #fff;
    }
    #signature-pad {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h3 class="mb-4">📝 아르바이트 종료 서약서</h3>
    <form id="pledgeForm">
      <div class="mb-3">
        <p>
          본인은 다음의 서약 내용을 충분히 이해하고 이에 동의합니다. 🙂<br><br>
          - 본인은 <strong>이번주 토요일(4.12)</strong>을 끝으로 아르바이트를 더이상 하지 않겠습니다. <br>
          - <strong>3월 31일까지 아르바이트를 끝낸다는 약속</strong>을 어긴 패널티로,<br>
            <strong>4월 용돈에서 10만원 감하여</strong> 받겠습니다.
        </p>
      </div>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="agreeCheck" required>
        <label class="form-check-label" for="agreeCheck">
          위 서약 내용에 동의합니다. 🙋
        </label>
      </div>

      <div class="mb-3">
        <label for="name" class="form-label">이름</label>
        <input type="text" class="form-control" id="name" name="name" required />
      </div>

      <div class="mb-3">
        <label class="form-label">서명 ✍️</label>
        <div class="signature-wrapper mb-2">
          <canvas id="signature-pad"></canvas>
        </div>
        <button type="button" class="btn btn-sm btn-secondary" id="clear">서명 지우기</button>
      </div>

      <button type="submit" class="btn btn-primary mt-3">제출하기 ✅</button>
    </form>

    <div id="result" class="mt-3 text-success fw-bold"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.5/dist/signature_pad.umd.min.js"></script>
  <script>
    const form = document.getElementById('pledgeForm');
    const canvas = document.getElementById('signature-pad');
    const clearBtn = document.getElementById('clear');
    const resultBox = document.getElementById('result');

    function resizeCanvas() {
      const wrapper = document.querySelector('.signature-wrapper');
      canvas.width = wrapper.offsetWidth;
      canvas.height = wrapper.offsetHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const signaturePad = new SignaturePad(canvas);

    clearBtn.addEventListener('click', () => signaturePad.clear());

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
      
        if (signaturePad.isEmpty()) {
          alert("서명을 해주세요.");
          return;
        }
      
        const name = document.getElementById('name').value.trim();
        const signature = signaturePad.toDataURL();
      
        const payload = { name, signature };
      
        try {
          await fetch('https://script.google.com/macros/s/AKfycbyQYqqX2l2VsD7gmKI2H8oHdcZKu6QMdOS6Y3WMdc7UxNeLYcLn3kFXTuuEiMHCdytv/exec', {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(payload),
            headers: {
              'Content-Type': 'application/json'
            }
          });
      
          // no-cors 모드로 인해 응답을 받을 수 없으므로 성공 가정 처리
          alert('🚀서약서가 정상 제출 되었습니다');
          resultBox.textContent = "✅ 서약서가 정상적으로 제출되었습니다.";
          resultBox.classList.add('text-success');
      
          form.reset();
          signaturePad.clear();
        } catch (error) {
          resultBox.textContent = "❌ 제출 중 문제가 발생했습니다. 다시 시도해주세요.";
          resultBox.classList.add('text-danger');
        }
      });
      
  </script>
</body>
</html>
