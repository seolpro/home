<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🤖신협 온뱅크 연결...</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f5f5f5;
      text-align: center;
    }
    .container {
      max-width: 800px;
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      width: 100;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    }
    .btn-copy {
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h4 class="mb-3">📲 온뱅크 앱 설치 안내</h4>
    <p>🤷‍♂️사용자의 운영체제를 자동으로 감지하여<br>해당 앱스토어로 연결됩니다.</p>
    <button class="btn btn-primary w-100" onclick="redirectUser()">온뱅크 앱 설치 바로가기</button>
    <button class="btn btn-outline-secondary w-100 btn-copy" onclick="copyScript()">📋 JS 복사</button>
    <textarea id="scriptCode" class="form-control mt-3" rows="7" readonly><script defer>
window.onload = function() {
    if (/Android/i.test(navigator.userAgent)) {
        window.location.href = "https://play.google.com/store/apps/details?id=kr.co.cu.onbank";
    } else if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        window.location.href = "https://apps.apple.com/kr/app/id1484456647";
    } else if (/Windows/i.test(navigator.userAgent)) {
        alert("✔PC window 운영체제로 신협 인터넷뱅킹으로 이동합니다.");
        window.location.href = "http://cu.co.kr";
    } else {
        window.location.href = "http://ajou9770.github.io/usertip/draw";
    }
};
<\/script></textarea>
  </div>

  <script>
    function redirectUser() {
      if (/Android/i.test(navigator.userAgent)) {
        window.location.href = "https://play.google.com/store/apps/details?id=kr.co.cu.onbank";
      } else if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        window.location.href = "https://apps.apple.com/kr/app/id1484456647";
      } else if (/Windows/i.test(navigator.userAgent)) {
        alert("✔PC window 운영체제로 신협 인터넷뱅킹으로 이동합니다.");
        window.location.href = "http://cu.co.kr";
      } else {
        window.location.href = "http://ajou9770.github.io/usertip/draw";
      }
    }

    function copyScript() {
      const scriptText = document.getElementById("scriptCode");
      scriptText.select();
      scriptText.setSelectionRange(0, 99999); // for mobile
      navigator.clipboard.writeText(scriptText.value)
        .then(() => alert("✅ JS 코드가 복사되었습니다!"))
        .catch(() => alert("❌ 복사에 실패했습니다."));
    }
  </script>
</body>
</html>
